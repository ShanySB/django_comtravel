{% extends "base.html" %}

{% block content %}

<section class="destination-detail-section">
    <div class="container">
        <h1>{{ destination.name }}</h1>
        <p>{{ destination.country }}</p>
        <p class="destination-description">
            {{ destination.description }}
        </p>
    </div>
</section>

{% if destination.image|stringformat:"s" != "placeholder" %}
     <img
        src="{{ destination.image.url }}"
        class="img-fluid destination-detail-image"
        alt="{{ destination.name }}"
    >
{% else %}
    <div class="destination-image-placeholder text-center p-5">
    <p class="mb-0">Image coming soon</p>
    </div>
{% endif %}                       

{% endblock %}
